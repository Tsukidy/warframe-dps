# warframe-dps workspace (overview.md §3; work-breakdown.md T01a).
# Dependencies are declared once here; crates use `dep = { workspace = true }`. A new dependency is a CONTRACTS.md
# entry (work-breakdown.md §2.1).

[workspace]
resolver = "3"
members = [
    "crates/wfd-model",
    "crates/wfd-data",
    "crates/wfd-engine",
    "crates/wfd-opt",
    "crates/wfd-buildcode",
    "crates/wfd-datagen",
    "crates/wfd-server",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
license = "UNLICENSED"

[workspace.dependencies]
# ---- workspace crates ----
wfd-model = { path = "crates/wfd-model" }
wfd-data = { path = "crates/wfd-data" }
wfd-engine = { path = "crates/wfd-engine", default-features = false }
wfd-opt = { path = "crates/wfd-opt" }
wfd-buildcode = { path = "crates/wfd-buildcode" }
wfd-datagen = { path = "crates/wfd-datagen", default-features = false }
wfd-server = { path = "crates/wfd-server" }

# ---- wfd-model (overview.md §3.1) ----
serde = { version = "1.0.229", features = ["derive"] }
bitflags = "2.13.2"
smallvec = { version = "1.16.6", features = ["serde", "union", "const_generics"] }   # 1.x, not the 2.0 beta
arrayvec = { version = "0.7.8", features = ["serde"] }
ts-rs = { version = "12.0.1", features = ["arrayvec-impl", "serde-json-impl", "no-serde-warnings"] }
schemars = { version = "1.2.3", features = ["smallvec1", "arrayvec07"] }
toml = "1.2.2"
serde_json = "1.0.154"

# ---- wfd-data ----
postcard = { version = "1.2.0", features = ["use-std"] }
ruzstd = "0.9.1"
arc-swap = "1.9.5"
blake3 = "1.8.7"
zstd = "0.14.4"

# ---- wfd-engine ----
libm = "0.2.16"
rayon = "1.12.0"

# ---- wfd-opt ----
rustc-hash = "2.1.3"
xxhash-rust = { version = "0.8.21", features = ["xxh3"] }
parking_lot = "0.13.0"

# ---- wfd-buildcode ----
miniz_oxide = "0.9.1"
base64 = "0.23.1"
lz-str = "0.2.1"

# ---- wfd-datagen ----
mlua = { version = "0.12.3", features = ["lua51", "vendored", "send"] }
ureq = "3.5.2"
lzma-rs = "0.3.0"
regex = "1.13.2"
sha2 = "0.11.1"
clap = { version = "4.6.9", features = ["derive"] }
include_dir = "0.7.4"

# ---- wfd-server ----
axum = "0.8.9"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["trace", "limit", "catch-panic"] }
http-body-util = "0.1.5"
mime_guess = "2.0.5"
webbrowser = "1.2.7"
directories = "6.0.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing-appender = "0.2.5"
anyhow = "1.0.105"
thiserror = "2.0.21"

# ---- dev tools (testing.md §1) ----
proptest = "1.12.0"
insta = { version = "1.49.0", features = ["json"] }
criterion = "0.8.2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# `clippy::float_cmp = "warn"` applies to the engine crates only (wfd-engine, wfd-opt); they repeat these lints in
# their own `[lints]` table because Cargo does not combine `workspace = true` with crate-level lint tables.

[profile.release]
lto = "fat"
codegen-units = 1
panic = "unwind"            # server-api.md §11: a panic in one request must not take the server down
