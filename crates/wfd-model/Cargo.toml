[package]
name = "wfd-model"
description = "Shared domain types of warframe-dps: ids, enums, stat registry, effect DSL, bundle schema, documents"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
default = []
# ts-rs derives for the generated TypeScript types (T01b `cargo xtask gen-ts`)
ts = ["dep:ts-rs"]
# schemars derives for the JSON schemas (T01b `cargo xtask gen-schema`, data/curated/schema.json)
schema = ["dep:schemars"]
# authoring form of data/curated/*.toml and its loader
curated = ["dep:toml"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
bitflags = { workspace = true }
smallvec = { workspace = true }
arrayvec = { workspace = true }
ts-rs = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
toml = { workspace = true, optional = true }

[dev-dependencies]
# The crate's own tests always build with every optional feature, so the plain `cargo test --workspace` of the
# definition of done (work-breakdown.md §2.3) runs the `curated`, `ts` and `schema` acceptance tests too
# (domain_examples, ts_schema). A dev-dependency on the crate itself only adds features to test builds.
wfd-model = { path = ".", features = ["curated", "ts", "schema"] }
serde_json = { workspace = true }
toml = { workspace = true }
postcard = { workspace = true }

[lints]
workspace = true

[[test]]
name = "domain_examples"
required-features = ["curated"]

[[test]]
name = "documents"

[[test]]
name = "ts_schema"
required-features = ["ts", "schema", "curated"]
