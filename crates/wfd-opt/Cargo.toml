[package]
name = "wfd-opt"
description = "Build optimizer of warframe-dps: pools, composition sets, branch-and-bound, context search (no I/O)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
default = ["parallel"]
# The rayon worker pool of the parallel search (optimizer.md §8). Without it the crate builds single-threaded and
# without rayon, so a WebAssembly build stays possible (overview.md §3.1). It also turns on the engine's MC worker
# pool, `wfd-engine/parallel` (CONTRACTS.md, T02d, merge instructions).
parallel = ["dep:rayon", "wfd-engine/parallel"]

[dependencies]
wfd-model = { workspace = true }
wfd-data = { workspace = true }
wfd-engine = { workspace = true }
# `RankedBuild.code` of every event and result is a `wfd1-` share code, and wfd-buildcode is the only encoder (AD-18;
# contract review API-7). No cycle: wfd-buildcode depends on model and data only; pure Rust, so the WebAssembly path
# stays open.
wfd-buildcode = { workspace = true }
# overview.md §3.1: rayon (parallel batches, §8), rustc-hash (memo cache `FxHashMap`, §8), xxhash-rust (xxh3-128
# canonical build keys, §8), parking_lot (shared keep-sets and incumbents). Declared by the skeleton for T32/T33.
rayon = { workspace = true, optional = true }
rustc-hash = { workspace = true }
xxhash-rust = { workspace = true }
parking_lot = { workspace = true }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
float_cmp = "warn"
