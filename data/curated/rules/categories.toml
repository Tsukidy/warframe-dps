# Mod compatibility categories and chains (09 §3.1-3.2, E-9.4, E-9.5; wiki Module:Mods/itemCompatibility/data;
# pipeline.md §5.3 Compatibility, §6.1; T03b).
#
# `[[category]]`: the bits of `CategorySet` (domain-model.md §7 `Rules.categories`): the generic nodes of the
# compatibility tree of 09 §3.1 (slot, class, sub-class and the melee types), named as the mod data names them
# (`M:Mods.Type`; every name except "Exalted Weapon" and "Bayonet" is a key of Module:Mods/itemCompatibility/data,
# which has 311 mod types). Mod types that name one weapon or family (Hek, Soma Prime, Skana …) and warframe augment
# types are not bits: E-9.4 puts `W.Family` and `W.Name` in nodes(W), and the pipeline resolves them to weapons
# (`CompatRule.weapons`, `ItemKind::WeaponMod.augment_of`). Companion, beast, K-Drive, Archwing, Necramech, operator and
# amp mod types are outside this tool's items (00 §1.3) and get no bit. "Claws" is not a bit for melee claws: the mod
# Type "Claws" is used by beast-claw mods; melee claw stances are matched by tag (09 §3.1).
#
# `[[chain]]`: chain(W) per (M:Weapons.Slot, M:Weapons.Class), 09 §3.1 table; exalted weapons with their own chain
# list their uniqueNames (`weapons`). Robotic and Hound weapons use the row of their class (09 §3.1 last row): the
# pipeline maps Robotic/Hound class Rifle, Sniper Rifle, Shotgun, Pistol, Melee, Glaive to the Primary, Secondary or
# Melee rows (the `slot = "Robotic"` rows below say so explicitly). Kitguns inherit the class of their chamber, zaws
# the melee class of their strike (09 §3.1, W:Mod/Compatibility L117, L146, L174).
#
# `[type_alias]`: norm_type of 09 §3.1 (EC-09-19) and melee_type(c) (the plural form the mod data uses). `Unique`
# (Adhesive Blast) and the riven stubs `Rifle or Pistol`, `Robotic Weapon` are not aliases (override list; rivens use
# 09 §12). Melee class Claws has no melee_type (09 §3.1).
#
# `[stance_tag]`: stance_tag(c) per melee class (09 §3.2: the tag the non-zaw weapons of class c carry in M:Weapons,
# majority, recounted from Module:Weapons/data/melee for this table) and the tag normalisation of EC-09-21 (keys in
# upper case are tag renames applied to mods and weapons before comparison).
schema = 1
sources = [
  "docs/mechanics/09-build-rules.md §3.1 (E-9.4, chain table, melee_type, norm_type), §3.2 (E-9.5, stance_tag, EC-09-21)",
  "wiki Module:Mods/itemCompatibility/data (cached 2026-11-24, 311 mod types)",
  "wiki Module:Weapons/data/melee (Class and CompatibilityTags, cached 2026-11-24)",
  "W:Mod/Compatibility L4-201",
]

