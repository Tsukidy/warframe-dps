# Factions (05 §4.2, §5.1, §6.2; 01 §4.10.4, §4.15 Tables 4.15-B and 4.15-C; D-008; pipeline.md §5.1, §6.1; T03b).
#
# The 17 factions of 00 §2.2 in that order. Per faction:
#   wiki_names  the `General.Faction` / `FactionDamageOverride` data strings that map to it (05 §4.2). An internal path
#               in `FactionDamageOverride` maps to neutral with a data warning (05 §4.2, EC-05-07): a rule, not a name.
#   bane_of     the faction slugs whose faction bonuses (bane mods, riven faction traits, Sacrificial set,
#               Paracesis) apply to a target of this faction: the faction itself and its `faction_group` of 01 Table
#               4.15-C (Kuva Grineer takes Grineer sources, Corpus Amalgam Corpus, Infested Deimos Infested; D-008).
#               Universal sources (Roar, Damage Blessing, Summoner's Wrath) use `faction = "any"` and need no entry.
#               An effect `faction = ["grineer"]` applies to every faction whose bane_of holds "grineer".
#   weakness    the weakness element of 01 Table 4.10-A (Reactive Storm, Sentient Incision), keyed by damage_faction;
#               none for Stalker, Tenno and Neutral (01 §4.10.4, D-102, OQ-110). The overguard row of Table 4.10-A
#               is a layer rule, not a faction.
#   scaling     the scaling class name of 05 §6.1-6.2 (health class; the shield class of the same faction is in the
#               05 §6.1 shield table: Grineer, Kuva Grineer, Scaldra, Infested, Infested Deimos and the default
#               factions use the Default shield curve, Orokin and Anarchs the Corrupted curve, Corpus and Corpus
#               Amalgam Corpus, Techrot Techrot). Names: grineer, corpus, infested, orokin, techrot, default.
#   exceptions  intended differences from the wiki `Module:DamageTypes/data` modifiers. None: 05 §5.1 "equals M:dt
#               Health entries with Introduced ≥ 31.5 cell by cell (checked with python3)".
schema = 1
sources = [
  "docs/mechanics/00-overview.md §2.2 (17 factions)",
  "docs/mechanics/05-enemies.md §4.2 (data strings), §5.1 (modifier table, equals M:dt), §6.1-6.2 (scaling classes)",
  "docs/mechanics/01-damage-composition.md §4.10.4 (Table 4.10-A weakness), §4.15 (Tables 4.15-B, 4.15-C)",
  "W:Faction_Damage_Bonus L1, L6-8; W:Reactive_Storm L34-45; W:Sentient_Incision L29-38",
]

