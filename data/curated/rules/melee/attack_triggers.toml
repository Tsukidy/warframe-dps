# Table 9-C: melee attack triggers (07 §9.7, §4.4; E-7.40 rule 1, E-7.43, E-7.45).
# Which stance entry, heavy or slide spawns which attack of the weapon, how many per trigger, how it scales, and the
# heavy flags. Transcribed from 07 §9.7 table 9-C (L1302-1320) with the stance entries of D:Stances (cached
# wiki-modules/raw/Stances_data.lua) and the attack names of D:<weapon> (cached wiki-modules/raw/Weapons_data_melee.lua);
# uniqueNames are the Public Export's (cached public-export/manifests/ExportWeapons_en.json, 2026-11-27).
schema = 1
sources = [
  "07 §9.7 table 9-C (L1302-1320)",
  "07 E-7.40, E-7.43 (exalted waves), E-7.45 (gunblade shots)",
  "D:Stances (cached Stances_data.lua)",
  "D:<weapon> AttackName (cached Weapons_data_melee.lua)",
  "W:Melee L750 (heavy_bonus default for non-hitscan heavy projectiles), via 07 §9.7",
]
notes = """
trigger: `heavy = { h = n }` is the Ranged entry of heavy n (no h = every heavy; a heavy combo with one attack is used
for h = 1 and 2, 07 E-7.40); `combo_ranged = { combo = K }` is every Ranged entry of combo K of the table the weapon
resolves by E-7.0b (no `input`: every Ranged input of the combo); `slide` is every slide strike.
count: `hits` = the triggering entry's Hits, i.e. one attack per strike (07 E-7.0 step 6 expands an entry into Hits
strikes; E-7.45 "a Ranged stance strike of a gunblade fires one shot"); `multishot` = the attack's Multishot;
`fixed = n` = n per trigger as table 9-C states it.
Rows from heavies default to heavy_combo = true, heavy_bonus = false (07 §9.7: "Non-hitscan projectiles created by
Heavy Attacks ... will often not be counted for bonuses like Killing Blow", W:Melee L750; Decision, UNVERIFIED,
OQ-717). Rows from light inputs and slides have both false.
Child attacks (AttackParentIndex) are not rows: Argo & Vel `Heavy Attack Glaive AoE`, Edun `Polearm Explosion` and
Caustacyst `Corrosive Pool` follow their parent (06 E-6.23).
Not mapped (07 §9.7): the Incarnon-form, conditional and multi-target attacks of Ack & Brunt, Ceramic Dagger, Okina,
Hate, Innodem, Destreza, Vinquibus, Korumm, Telos Boltace, Vitrica, Sigma & Octantis and Orvius (data_attack_loop
only, EC-07-52), and the unmapped Ranged entries Harrowing Spire Block input 1, Cobra & Crane and Sigma & Octantis
Aerial input 1, Vitrica Aerial input 1 (no damage, one data-report line each; OQ-727). The Ranged entries of the
stanceless Gunblade Finisher (Stances_data.lua L5330) are not mapped: finishers use table 9-E (07 §9.11).
"""

