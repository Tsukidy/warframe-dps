# Table 9-E: finisher multipliers per class (07 §9.11, §4.4; 04 §7.2, E-4.17; toggle T-34 finisher mode).
# Transcribed from W:Finisher §All Finishers Multiplier Comparison (research/external/cache/wiki/Finisher.wiki, pinned
# 2026-11-24, lines 458-566); every row cites its line.
schema = 1
sources = [
  "W:Finisher §All Finishers Multiplier Comparison (cached L458-566)",
  "07 §9.11 (Sword 10x / 16x (8x + 8x) / 8x (6x + 2x) / 8x / 8x; Hammer; Claws ground; Valkyr Talons ground)",
  "W:Exalted_Blade L41 (ability-page values for Exalted Blade, OQ-721)",
]
notes = """
kinds: ground, stealth, back, front, universal = the page's columns Ground, Stealth, Back, Front and Universal Finisher
Multiplier. Each value is the hit split: one element per hit, each hit one instance of 04 E-4.17 with M_class = that
element (07 §9.11); a column without a split is one hit. "Ax x N hits" is N hits of A; "Nx (A + B)" is [A, B].
The page has no Dual Nikanas row; that class has no row here (no source).
The page lists two exalted weapons by name: their rows have class exalted_weapon and name the weapons (Exalted Blade
with its Prime and Umbra variants, Valkyr Talons with Valkyr Prime Talons; 07 E-7.43 family scope).
Page inconsistencies kept as written and flagged in the row source: Sparring back (split 1.6x + 5.4x = 7x under an 8x
total), Assault Saw universal 1x. Heavy Scythe carries the page's UpdateMe banner (L459).
"""

