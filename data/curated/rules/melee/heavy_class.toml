# Table 9-A: class heavy attack table (07 §9.1, §4.4; E-7.40 rule 2).
# One row per melee class: T_{class,1}, T_{class,2}, the explicit per-hit breakdown where the wiki gives one, and the
# typical wind-up. Transcribed from W:Melee §Heavy Attack Damage (research/external/cache/wiki/Melee.wiki, pinned
# 2026-11-24, lines 575-638); every row cites its line.
schema = 1
sources = [
  "W:Melee §Heavy Attack Damage (cached Melee.wiki L575-638)",
  "07 §9.1 table 9-A, E-7.40",
  "07 TV-07-10",
]
notes = """
total = [T_{class,1}, T_{class,2}] as multiples of weapon damage; the second column is the second heavy (the page's
"or Slide Heavy Attack").
breakdown = [heavy 1, heavy 2]: only where the page gives a hit split in parentheses ("5x (250% + 250%)"); a total
with a proc and no split ("5x Bleed") has no breakdown, its Bleed is in the row's source. E-7.40 rule 2 uses a
breakdown only when its strike count differs from the stance data's direct strikes, and then with its Bleed procs
only (Bleed = SLA, 03 table 4.2); a crowd-control name of the split (Dagger heavy 1 Knockback) is kept in `cc`.
"N x M%" in a split is N strikes of M% each; "3 x 100% Bleed" is three strikes each carrying Bleed.
wind_up: the page's "Typical Wind-up Time"; the weapon's own WindUp field wins (07 §4.3).
Glaive and Gunblade rows are transcribed but not used for damage (07 §9.4, §9.5: their heavies come from data
attacks and the stanceless Gunblade Heavy combo).
Bayonet has no row: it is not on the page, and 07 table 9-A (L1131) lists it with "–" for both heavies and the
wind-up ("stance data only, sigma = 1"); E-7.40 rule 2 gives sigma_h = 1 to a class without a row (07 TV-07-21
Vinquibus: "Bayonet stanceless Heavy (sigma = 1, no 9-A row)"). Every other class of MeleeClass except
ExaltedWeapon and ArchMelee has exactly one row.
"""

