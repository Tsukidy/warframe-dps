# Table 9-B: weapon heavy factors kappa_w (07 E-7.41, §4.4).
# kappa_w = r_w / r_mode(class), r_w = PE heavyAttackDamage / PE totalDamage. The pipeline computes kappa_w by
# E-7.41 for every weapon that uses the class heavy table and checks the result against these rows (domain-model.md
# MeleeRules.heavy_kappa: "checked against the E-7.41 computation"). Weapons not listed have kappa_w = 1.
schema = 1
sources = [
  "07 E-7.41 (current members: Hirudo 6.5/12, Coda Hirudo 6.502857/12, Korrudo 10.699482/12, Tak & Lug 12/5)",
  "W:Melee L623 (HTML comment: 'Hirudo and Korrudo differ, 6.5x and 10.7x respectively')",
  "D:<weapon> HeavyAttack (cached wiki-modules/raw/Weapons_data_melee.lua)",
  "PE:<weapon> heavyAttackDamage / totalDamage (cached public-export/manifests/ExportWeapons_en.json, 2026-11-27)",
]
notes = """
kappa is r_w / r_mode with the r_w values of E-7.41 (rounded to 6 decimals there) and r_mode = the class value of
table 9-A (Sparring 12, Sword and Shield 5). kappa_w applies to both heavies (Decision, UNVERIFIED for heavy 2,
07 OQ-723). uniqueNames are the Public Export's.
"""

