notes = """
Columns of the page -> cells: Neutral -> neutral, Forward -> forward, Forward Block -> forward_block, Block -> block,
Slide Attack -> slide, Ground Slam Strike -> slam, Ground Finisher -> finisher, Wall Attack -> wall, Air Attack ->
aerial, Heavy Attack -> heavy. A blank cell of the page has no entry; E-7.21 reads it as 1.0. Every cell holds one
value (the page gives one ratio per combo: "Stance multipliers for all hits in that combo", L573).
first_of_class marks the first row of each weapon class, which alone fills the shared columns (slide, slam,
finisher, wall, aerial, heavy) that E-7.21 applies to every stance of the class and to stanceless weapons of the
class (Decision, UNVERIFIED, 07 OQ-716).
The six exalted stances (Serene Storm, Razorwing, Exalted Blade, Primal Fury, Ravenous Wraith, Hysteria) have class
exalted_weapon and no first_of_class flag: each is its own weapon's stance and E-7.21 reads its shared columns from
its own row ("exalted stances: their own row"); the page names the weapon in the class column, kept in the source.
The slam column is unused by the engine (CO behaviour `none` for slams, 04 D2; E-7.21).
"""

