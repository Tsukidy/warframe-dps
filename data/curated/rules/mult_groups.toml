# Multiplier groups (domain-model.md §14; pipeline.md §6.1; T03b).
#
# Members of one group add; groups multiply. Effects name a group with `mult = "<id>"` (domain-model.md §11.1).
# An unlisted weapon-side multiplier is its own `G` group (04 §3.2 default rule), so only the sources the spec names
# are listed here.
#
# Stages (domain-model.md §14): `GF` = G_F of 04 §3.1 (omitted by the adding CO term, E-11, D-058); `G` = 04 §3.2;
# `overguard_only` = M_OG (00 E-12); `spot` = M_son of Part (02 E-2.10, 00 E-7); `target_vuln` = the multiplicative
# members of V (05 E-5.19, 04 §5.7). No `dot_only` group is needed: the M_dot,s members of 00 E-13 are the stat
# `dot_vuln` (V_sd: Burning Hate, Pageflight, custom p.o; 03 §9.4) and the second dips of Mecha Empowered and the
# Vauban passive, which are `G` groups with `dot = "twice"` (03 §9.4 M_tick, D-041).
#
# `dot` (domain-model.md §14): `inherit` = the factor is part of the DoT seed (00 E-13 seed = Y·(1 + F)·G·…·Part_dot,
# G_F inside Y); `twice` = seed and M_tick (Mecha, Vauban); `none` = not in the seed. TargetVuln groups are `none`:
# V is applied by the enemy stage to every damage instance, every DoT tick included, at tick time, and "never enters
# the weapon side or the DoT seed" (05 §13, CD-05). The overguard-only group is `none`: M_OG,p is stored with the proc
# and applied by 05 when a tick lands on overguard (03 §9.4), not through the seed.
#
# Engine factors that are computed, not effect targets, are not groups: combo multiplier M(c) and M_h (07 E-7.10),
# ability combo (T-11, 07), sniper combo (06 E-6.16), beam ramp-up (06), Peacemaker burst ramp (06 E-6.19 b_pm),
# range falloff Φ(d) (06), bow charge (06 §5) and the catalogue `co_omit` (04 §2.14). Devouring Attrition (Phenmor
# and Laetum, 04 §3.2, §5.12: ×21 with probability 0.50 on k = 0) is the mechanic `random_multiplier`, whose factor the
# engine places in G itself; no group names it, so a deterministic `mult` encoding cannot be written (domain-model.md
# §16.13; contract review DC-25).
schema = 1
sources = [
  "docs/mechanics/04-conditional-bonuses-and-buffs.md §3.1, §3.2, §5.6, §5.7",
  "docs/mechanics/05-enemies.md §13 (E-5.19)",
  "docs/mechanics/00-overview.md E-7, E-12, E-13",
  "docs/architecture/domain-model.md §14",
]

