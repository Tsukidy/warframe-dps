# Riven traits: trait → effect template, coefficients b and legality data (04 §8.1-8.3; 09 §2.4, §12.2-12.3;
# domain-model.md §16.6; pipeline.md §6.1; T03b).
#
# Each trait maps once to an effect template (04 §8.1); the riven value enters as the param `value` (absent `value` in
# the template means `{ param = "value" }`). A trait without `template` has no damage effect (04 §8.1 last row).
# `coeff`: b per coefficient column (04 §8.3; a missing column = "–", the trait cannot roll there, 09 E-9.55 T2);
# Kitgun rivens use the pistol column, Zaw the melee column, companion rivens the column of the weapon class (09 E-9.50).
# Every value equals the Public Export `upgradeEntries` base of the cited `pe_tag` (ExportUpgrades `/Lotus/Upgrades/Mods/
# Randomized/*RandomModRare`, fetched 2026-11-27) to the precision of 04 §8.3; where PE rounds differently the spec
# value is kept (Rifle Damage 0.0183333 vs PE 0.018333; Puncture 0.01333 vs PE 0.01333; Rifle Impact/Slash 0.013333).
# `sign` (09 E-9.55 T3, T4), `spliced` and `recipes` (09 §12.3), `inspiration_key` (09 §2.4, the link keys `p`).
# `vintage_companion` (09 §12.3, W:Riven_Mods L921-922): a vintage trait of companion rivens (Zoom, Recoil, Ammo Maximum;
# melee Combo Duration, Critical Chance for Slide Attack, Finisher Damage, Heavy Attack Efficiency, Initial Combo, Chance
# to Gain Combo Count), legal when present but never produced on a companion riven by riven generation (contract review
# API-12). The wiki adds that the splices of these traits are "also unobtainable on companion Rivens"; 09 §12.3 does
# not say so, so no spliced trait carries the flag (question to the 09 owner, CONTRACTS.md).
# `input` (04 §8.2): percent (±x % → x/100), faction_multiplier (×y → y − 1), absolute (m, s, counts raw).
#
# Split rows: "Damage / Melee Damage" (04 §8.1) is two traits because the sign rule differs (guns may be negative,
# 09 E-9.55 T4 Decision, UNVERIFIED; melee and zaw positive only, T3) and PE uses two tags; "Fire Rate / Attack Speed"
# is two traits because the bucket differs (06 fire rate, 07 attack speed). Both pairs share the inspiration key.
# Damage to Corpus / Grineer / Infested uses one tag for guns (WeaponFactionDamage*) and one for melee
# (WeaponMeleeFactionDamage*, same b 0.005); `pe_tag` names the gun tag.
#
# Ammo Efficiency and Chance to Gain Combo Count have a negative b: the card shows −100·v %, the bucket receives the
# displayed bonus +x/100 (04 §8.2 conversion table). Their templates carry a note: the conversion of the typed value
# into the bucket value is the riven input converter's (T04/T13), not a template factor.
schema = 1
sources = [
  "docs/mechanics/04-conditional-bonuses-and-buffs.md §8.1 (trait → bucket), §8.2 (input conversion), §8.3 (coefficients b, spliced values)",
  "docs/mechanics/09-build-rules.md §2.4 (inspiration trait keys), E-9.50, E-9.55 (signs), §12.3 (splice recipes, companion vintage traits)",
  "W:Riven_Mods §Base Values L809-921 (companion vintage traits L921-922), spliced values L924-985, recipes L1312-1398",
  "Public Export ExportUpgrades_en.json (Randomized riven upgradeEntries), fetched 2026-11-27",
  "docs/architecture/domain-model.md §16.6",
]

# ---- Ordinary traits (04 §8.3 table) ----

# 04 §8.1 Damage (guns) → A; negative values possible (09 E-9.55 T4, Decision, UNVERIFIED, 04 OQ-424).
[[trait]]
id = "damage"
pe_tag = "WeaponDamageAmountMod"
input = "percent"
coeff = { rifle = 0.0183333, shotgun = 0.0183, pistol = 0.0244, archgun = 0.0111 }
inspiration_key = "base"
template = { stat = "base_dmg" }

