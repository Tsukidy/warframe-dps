# Slot layouts per equipment class (09 §2.1-2.3, E-9.1-E-9.3, E-9.30; pipeline.md §6.1; T03b).
#
# One `[[layout]]` per `EquipmentClass` (09 E-9.1 and the table of 09 §2.2). Each slot lists the content kinds it
# accepts (09 E-9.3), the family of an arcane slot (09 E-9.30) and its position in the element combination order of
# 01 §4.10.1 (`element_order`, domain-model.md §13): general slots 0-7 in reading order (09 §2.1, W:Mod L135-141,
# W:Calculating_Bonuses L230), exilus 8 (01 EC-01-26, OQ-024), every weapon arcane slot and every Incarnon perk slot 9
# (01 E-1.8: sub-index 0 for an arcane slot, the evolution t for `inc<t>`). Warframe, stance, aura, shard and subsumed
# slots have no `element_order`: they cannot hold a combining `Slot` element (warframe arcanes use
# `ElemOrder::WarframeArcane`, position 10; CONTRACTS.md T01d review fix 2).
#
# Rivens (`riven` kind) are accepted in the general slots of the classes whose riven class is not `none` (09 E-9.50):
# not on exalted, pseudo-exalted or Necramech exalted weapons, not on archmelee. Garuda Talons (an ordinary melee
# weapon for E-9.2, no rivens by E-9.50) is decided by the weapon rule, not by the layout. Incarnon perk slots exist in
# the primary, secondary and melee layouts; only weapons with an Incarnon line can fill them (09 §13).
# Adapters and gilding are assumed installed (09 §2.2 Decision).
#
# Two arcane slots on one weapon (kitguns, zaws, archguns) share position 9 with sub-index 0 (01 E-1.8 gives no rule
# for two arcane slots; no arcane of the second slot is known to carry a combining element: UNVERIFIED).
#
# `aura1` exists in the warframe layout; it is usable only on frames whose `aura_slots` is 2 in rules/frames.toml
# (Jade, 09 §2.1, E-9.2).
schema = 1
sources = [
  "docs/mechanics/09-build-rules.md §2.1 (slot ids), §2.2 (E-9.1, E-9.2 and the slot-count table), §2.3 (E-9.3), §8 (E-9.30), §12.1 (E-9.50)",
  "docs/mechanics/01-damage-composition.md §4.10.1, E-1.8",
  "docs/architecture/domain-model.md §13",
  "W:Mod L135-147; W:Exalted_Weapon L94-96, L233-249, L312; W:Arcane_Enhancement L19-26",
]

