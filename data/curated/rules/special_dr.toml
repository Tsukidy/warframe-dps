# Special damage reduction and hand-authored enemy rows (05 §4.4, §4.5, §13.1, §14, §15; pipeline.md §5.3, §6.1;
# T03b).
#
# `[[dr]]`: the unique-DR definitions of 05 §15 (attenuation E-5.21, DPS-scaled DR E-5.22, adaptation E-5.23), named
# by `special_dr` in the enemy rows. T-28 off removes all of them and every flat DR of the rows below (05 §15.5).
#
# `[[enemy]]`: hand rows keyed by 05 §4.1 ids (`<module>:<key>`, the wiki module file's faction suffix and the record
# key; the lists were checked against the cached Module:Enemies/data/* modules of 2026-11-24, which hold every id used
# here). A group named by 05 is listed member by member (05 §4.1 "Keys of hand-authored rows"). Absent fields keep
# the data value; `immune` (05 §4.4 "ALL" = every StatusType, written out) adds to the record's `Stats.ProcResists`; `caps` and `cap_all` are 05 §4.4 per-enemy caps
# (`cap_all` = "every status", `caps` per type wins over it); `flags` are EnemyFlags (domain-model.md §5):
# strip_immune / strip_immune_flat (`armor_strip_immune` all / flat_only), shield_strip_immune,
# shield_weapon_immune / shield_displayed_type, shield_no_regen / shield_no_regen_after_break, ability_debuff_immune /
# ability_debuff_dispelled (05 §13.1), toxin_blocked / toxin_nullify, no_freeze, party_scaled, cc_immune, adversary,
# status_capped (set on every row that carries caps). An enemy listed in several rows gets the union of their
# `flags` and `immune` sets; every other field is set by at most one row (checked by tests/rules_tables.rs), so the
# row order does not matter.
#
# Rows whose enemy has no module record (Kuva Lich, Sisters of Parvos, Sister Hounds, Kuva Lich Thralls, Skittergirl,
# Technocyte Coda) are kept as data gaps with `enemies = []` and the group named in a comment (05 §4.1: "it attaches to
# nothing until a base record ... is hand-authored with a citation", OQ-526).
#
# Not rows here (other owners or rules, not id lists):
# - part data of 05 §4.3 hand rows and the Scaldra Dedicant / Screamer `part_dr` 0.30 (05 §4.5 row, footnote ⁴ L937):
#   data/curated/overrides/enemies/*.toml (T18); the Juggernaut "ALL on every part except maw and belly" immunity of
#   05 §4.4 is the parts' `status_ok` (same overrides).
# - the `boss` caps COL 4 and BLA 4 (05 §4.4 "records with boss = true not listed above") follow the `boss` flag of
#   the record (General.Type rule of 05 §4.1), and the og_present caps (COL 4; PUN 3 for vip) are state rules of 03
#   E-3.2: rules, not rows.
# - Entropic Eximus (`dr_class[non_melee]` 0.90, `ability_debuff_immune = all` while the orb is active) and Guardian
#   Eximus (`dr_class[radial]` and `dr_class_og[radial]` 0.90) are Eximus kinds of T-23, not records (05 §4.1 "Eximus
#   kind"); the engine applies them from the scenario's kind (T07).
# - `eximus_capable` and `eximus_kinds` come from W:Eximus/Compatibilities (T18); only the hand-authored
#   `eximus_og = false` rows of 05 §4.1 are here.
schema = 1
sources = [
  "docs/mechanics/05-enemies.md §4.1 (groups, hand-authored fields), §4.4 (immunities, caps), §4.5 (DR table), §13.1, §14 (E-5.20), §15 (E-5.21-E-5.23, T-28)",
  "wiki Module:Enemies/data/* (cached 2026-11-24): ids",
]

# ---- 05 §15 definitions ---------------------------------------------------------------------------------------------

[[dr]]
id = "hemocyte"
attenuation = { p_att = 0.05, layers = ["HP"], mdps_frac = 0.20 }
sources = ["05 §4.5 (Hemocyte attenuation {0.05, {HP}}; MDPS 0.20 documented only, §15.2: stored, not applied)", "05 §15.1 (E-5.21)", "W:Hemocyte L19-35, L79, L89", "TV-05-15"]

[[dr]]
id = "lephantis"
attenuation = { p_att = 0.05, layers = ["HP"] }
sources = ["05 §4.5 (Lephantis attenuation {0.05, {HP}})", "05 §15.1", "W:Lephantis L28"]

[[dr]]
id = "eidolon"
attenuation = { p_att = 2.0, layers = ["SH", "HP"], mdps_frac = 1.0 }
sources = ["05 §4.5 (Eidolons attenuation {2.00, {SH, HP}}; MDPS 1.00 documented only, §15.2: stored, not applied)", "05 §15.1", "W:Eidolon_Teralyst L75 (U40.0.3)"]

# Standardised U40 attenuation with an unknown parameter: not applied, the result is flagged `attenuation_unknown`
# (05 §15.1, OQ-510). `layers` follows E-5.21 (layers ⊆ {SH, HP}); it has no effect while p_att is unknown.
[[dr]]
id = "attenuation_unknown"
attenuation = { layers = ["SH", "HP"] }
sources = ["05 §4.5 last row (attenuation = unknown)", "05 §15.1 (\"Every other attenuated enemy gets no attenuation and the result carries the flag attenuation_unknown\")", "F:enemy §9.1", "OQ-510", "OQ-022"]

# E-5.22 as points (X_dps, DR) with DR = 1 − M_dps(X), read only through `SpecialDrDef::dps_multiplier` (the field's
# doc states the rule): between two consecutive points the effective DPS X·(1 − DR) is linear in X, which reproduces
# every band M_dps(X) = a + b/X of E-5.22 exactly (the bands are continuous at 1000, 2500, 5000, 10000); beyond the
# last point the last segment continues (0.02 + 4100/X). DR itself is NOT linear between the points. Check: 2500 →
# M 0.82; 5000 → 0.66; 10000 → 0.43; 20000 → 0.225.
[[dr]]
id = "orphix"
dps_dr = [[0.0, 0.0], [1000.0, 0.0], [2500.0, 0.18], [5000.0, 0.34], [10000.0, 0.57], [20000.0, 0.775]]
sources = ["05 §15.3 (E-5.22)", "W:Orphix L30-44", "JS L13118-13124 (orphixDR, identical)"]

# E-5.23. res = ρ_j per adaptation step; params: the HP_max fractions of the four gates (g1 … g4), the Sentient extra
# 40 % that stays (extra_res), and the per-instance health caps by HP band (hit_cap_* with the band floors band_*).
[[dr]]
id = "sentient_adaptation"
adaptation = { kind = "sentient", res = [0.90, 0.80, 0.75, 0.70], params = { g1 = 0.25, g2 = 0.45, g3 = 0.65, g4 = 0.80, extra_res = 0.40, hit_cap_band1 = 0.25, band1_floor = 0.75, hit_cap_band2 = 0.20, band2_floor = 0.35, hit_cap_band3 = 0.15, band3_floor = 0.20 } }
sources = ["05 §15.4 (E-5.23)", "W:Sentient L293-323", "OQ-511 (accumulator, ties and band edges UNVERIFIED)"]

[[dr]]
id = "shadow_stalker_adaptation"
adaptation = { kind = "shadow_stalker", res = [0.95, 0.95, 0.95, 0.95], params = { g1 = 0.25, g2 = 0.45, g3 = 0.65, g4 = 0.80 } }
sources = ["05 §15.4 (E-5.23: ρ_j = 0.95, same gates; The Vast Untime also resets)", "W:Shadow_Stalker L34-44"]

