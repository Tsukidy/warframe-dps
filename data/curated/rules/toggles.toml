# Toggle descriptors T-01 … T-43 (spec 00 §6.1; domain-model.md §9.3 TOGGLE_MAP; server-api.md §5.6
# ScenarioSchema.toggles; pipeline.md §6.1; T03b).
#
# One `[[toggle]]` per row of 00 §6.1, in its order and numbering (T-30 melee plan, T-35 capacity mode, T-36 lower
# ranks; CONTRACTS.md T01d). The values, ranges and defaults are the spec's (00 §6.1 "Values, default" column; the
# owning documents where it defers to them); every row cites them in its comment.
#
# `field` is where the value lives, the place of the toggle in `wfd_model::scenario::TOGGLE_MAP`:
#   a ScenarioDoc path as written there ("toggles.hit_location", "eval.window_s"; `|` separates several paths, a path
#   through a list names the list, "buffs.caster"); "buffs" for the T-13 … T-19 buff toggles (the buff items whose
#   `ItemKind::Buff.toggle` is the id, param `value`); a BuildDoc path prefixed "build." ("build.variant.progenitor");
#   an optimizer-request path prefixed "opt." ("opt.constraints.capacity.ranks").
# `default` is the JSON value the default document holds at `field` (ScenarioDoc::against(..) and Toggles::default()),
#   so the descriptor never disagrees with the model; for several paths it is an object keyed by path. Two exceptions,
#   stated in their rows: T-23 (the enemy is the user's pick: null) and the buff toggles (null = off; the spec's
#   "default when on" value is in the help text and the buff item's param default).
# TOML has no null: a toggle without `default` defaults to JSON null, and a path missing from a default object is null.
# `label`, `help` and option labels are i18n keys `toggle.<id>.label`, `toggle.<id>.help`, `toggle.<id>.opt.<value>`
#   (frontend.md §8). Model units throughout (fractions, not percent).
schema = 1
sources = [
  "docs/mechanics/00-overview.md §6.1 (T-01 … T-43), §6.2 (T-02), §6.3 (T-26)",
  "docs/architecture/domain-model.md §9.3 (placement table, TOGGLE_MAP)",
  "docs/architecture/server-api.md §5.6 (ScenarioSchema.toggles)",
  "docs/architecture/frontend.md §8 (key names toggle.T-13.label)",
]

# Fight window: 1-60 s (advanced 1-600), default 20 (00 §6.1 T-01; 00 §4.1 t_win). max = the advanced bound.
[[toggle]]
id = "T-01"
field = "eval.window_s"
group = "evaluation"
label = "toggle.T-01.label"
help = "toggle.T-01.help"
control = { kind = "number", min = 1.0, max = 600.0, step = 1.0 }
default = 20.0

# Conditions: all_max (default), none, simulated (00 §6.1 T-02, §6.2).
[[toggle]]
