# Reference weapon per item class for `xtask effect-smoke` (testing.md §3, §11): every item is evaluated on the
# weapon of its class. Values are DE uniqueNames, resolved in the generated bundle (data/generated/), so the
# weapons need not be in the mini fixture bundle. Keys are the `WeaponClass` names of crates/wfd-model/src/enums.rs
# (snake_case) plus three extras: `glaive` (a melee subclass with its own throw rules, 07 §9.4), `kitgun` and `zaw`
# (assembled weapons, 06 §11, 07 E-7.42). `amp` has no entry: operator and amp damage are out of scope (00 §1.3).
# `arch_melee` is listed although 00 §1.3 puts archmelee damage out of scope, so archmelee mods still get a smoke
# run. Source of every uniqueName: wiki `Module:Weapons/data/*` (`InternalName`; cached 2026-11-23, the classes
# added by the T03 fix from the pinned revisions of research/tools/wiki-pins.tsv: primary 2824271, secondary
# 2820918); the kitgun and zaw parts: DE Public Export `ExportWeapons`. `crates/wfd-model/tests/fixtures.rs` checks
# the keys against `WeaponClass`.
schema = 1

[weapons]
